.hero.audit{background:radial-gradient(1000px 300px at 85% -40%,rgba(120,170,210,.45),transparent 60%),linear-gradient(120deg,#13263a,#24476a 60%,#3f6f8f)}

<div class="foot">Caso ficticio con fines docentes · INCAE Business School · AmCham Perú. Cifras en soles constantes; los resultados son estimaciones del modelo del caso, no estados financieros.</div>

<script>

const ALTS = {

  c7: { titulo: 'Vecinos que inspeccionan a vecinos', regla: 'Control interno sin registro digital.' },
  agua: { titulo: 'El agua de Juliaca', regla: 'Carta comodín: cualquier mesa, como segunda carta.' }
};

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const milesM = n => Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const SM = n => (n < 0 ? '−' : '') + 'S/' + milesM(n);
const r1d = x => Math.round(x * 10) / 10;

/* Punto de partida a partir del estado exportado por la simulación A/B (version andina-ab-1.0) */
function puntoReferencia(cfg) {
  return { origen: 'referencia', fam: cfg.famRef, continua: false, monitoreo: false, saldoFondo: 0, prima: cfg.primaRef,
    margen: cfg.margenRef, opcion: cfg.opcionRef, referencia: true, nota: ['Términos de referencia: NordMarkt aceptó un año 4 de prueba con 25 familias y las condiciones de su carta.'] };
}

/* Punto de partida común e independiente del Caso C */
function puntoComun(cfg) {
  return { origen: 'comun', fam: cfg.famRef, continua: true, monitoreo: false,
    saldoFondo: 0, prima: cfg.primaRef, margen: cfg.margenRef,
    opcion: cfg.opcionRef, referencia: false,
    nota: ['Punto de partida independiente del Caso C: 25 familias, prima y margen de S/1.000 por tonelada y opción de 20 t de NordMarkt.'] };
}

function asignarCarta(d) {
  const vp = !!(d.alts.a2 || d.alts.a4);
  if (!vp || d.familias === 'ninguna') return 'c1';
  if (d.familias === 'expulsion') return 'c2';
  if (d.alts.a2 && d.apoyo === 'ninguno') return 'c3';
  if (d.alts.a4 && !d.alts.a2) return 'c7';
  if (d.datos !== 'asociacion' || (d.usos && d.usos.precios)) return 'c4';
  if (d.sensores) return 'c6';
  return 'c5';
}

/* Cálculo completo. card = null (antes de la compuerta) o { id, ops: {...}, detener, agua } */
function calcC(cfg, st, d0, card) {
  const d = JSON.parse(JSON.stringify(d0));
  d.usos = d.usos || {};
  const ops = (card && card.ops) || {};
  const id = card ? card.id : null;
  const notas = [], alertas = [];
  const A = cfg.alts;
  let vp = !!(d.alts.a2 || d.alts.a4);
  let familias = d.familias;
  let datos = d.datos, usaPrecios = !!d.usos.precios;
  let acepta = vp && familias !== 'ninguna';
  let demora4 = null, penal4 = 0;
  let migra = false, promotor5 = false, ocultar = false, escala = null, afirmacion = null;
  let haAdj4 = 0, haAdj5 = 0, salidas5 = 0, readmite = false;
  let addA4 = false;

  if (id === 'c1') {
    if (ops.c1 === 'redisenar') {
      if (!vp) { addA4 = true; d.alts.a4 = true; demora4 = cfg.tasaDemora; notas.push('Rediseño: control interno agregado con meses de retraso.'); }
      else { penal4 = cfg.demoraPenal; notas.push('Rediseño: plan de corrección presentado tarde.'); }
      if (familias === 'ninguna') familias = 'verificacion';
      vp = true; acepta = true;
    } else { acepta = false; }
  }
  if (id === 'c2') { if (ops.c2 === 'readmitir') { readmite = true; familias = 'verificacion'; } else salidas5 += cfg.salidaContagio; }
  if (id === 'c3') { if (ops.c3 === 'promotor') promotor5 = true; else salidas5 += cfg.salidaCuadernos; }
  if (id === 'c4') { if (ops.c4 === 'clausula') { datos = 'asociacion'; usaPrecios = false; } else salidas5 += cfg.salidaDatos; }
  if (id === 'c5') {
    if (ops.parcela === 'incorporar') haAdj5 += cfg.haNoDeclarada;
    if (ops.pasto === 'excluir') { haAdj4 -= cfg.haPasto; haAdj5 -= cfg.haPasto; }
    if (ops.pasto === 'ocultar') { ocultar = true; haAdj5 -= cfg.haOcultar; alertas.push('El auditor encontró la siembra en pasto comunal: los lotes de esas dos familias quedan fuera en el año 5.'); }
  }
  if (id === 'c6') { afirmacion = ops.afirmacion || null; escala = ops.escala || null; if (afirmacion === 'empaque') alertas.push('El área legal de NordMarkt bloqueó la afirmación en el empaque: una campaña no basta.'); }
  if (id === 'c7' && ops.c7 === 'migrar') migra = true;
  const detener = !!(card && card.detener);
  const agua = card && card.agua ? card.agua : null;

  const digital = !!d.alts.a2, digital5 = digital || migra;
  /* ---- costos ---- */
  const sel = ['a1', 'a2', 'a3', 'a4'].filter(k => d.alts[k]).concat(d.sensores ? ['a5'] : []);
  let y4 = 0, y5 = 0, inst = 0;
  sel.forEach(k => { inst += A[k].inst; y4 += A[k].inst + A[k].anual; y5 += A[k].anual; });
  if (digital) {
    if (d.apoyo === 'telefonos') { y4 += cfg.telefonos; inst += cfg.telefonos; }
    if (d.apoyo === 'promotor') { y4 += cfg.promotor; y5 += cfg.promotor; }
  }
  if (promotor5) y5 += cfg.promotor;
  if (migra) y5 += A.a2.inst + A.a2.anual + cfg.promotor;
  if (detener) y5 = 0;
  const total = y4 + y5;

  /* ---- financiamiento ---- */
  const nmBase = ['a1', 'a2'].filter(k => d.alts[k]).reduce((s, k) => s + A[k].inst + A[k].anual + (detener ? 0 : A[k].anual), 0)
    + (migra && !detener ? A.a2.inst + A.a2.anual : 0);
  const nmElegible = d.nmAcceso ? Math.min(cfg.nmMax, nmBase) : 0;
  const fondoBase = ['a2', 'a4', 'a5'].filter(k => d.alts[k] || (k === 'a5' && d.sensores)).reduce((s, k) => s + A[k].inst, 0) + (migra && !detener ? A.a2.inst : 0);
  const fondoElegible = datos === 'asociacion' && !usaPrecios ? cfg.fondoPct * fondoBase : 0;
  let nm = clamp(d.aporteNM || 0, 0, nmElegible);
  let fondo = fondoElegible;
  let asoc = clamp(d.aporteAsoc || 0, 0, cfg.asocMax);
  let cont = clamp(d.usoFondo || 0, 0, st.saldoFondo || 0);
  // nadie paga más de lo que cuesta la solución
  let resto = total;
  fondo = Math.min(fondo, resto); resto -= fondo;
  nm = Math.min(nm, resto); resto -= nm;
  cont = Math.min(cont, resto); resto -= cont;
  asoc = Math.min(asoc, resto); resto -= asoc;
  const andina = resto;
  if (andina > cfg.presupuesto) alertas.push(`Andina paga ${SM(andina)}: supera los ${SM(cfg.presupuesto)} y requiere volver al directorio.`);

  /* ---- tasas de evidencia ---- */
  let base = null;
  if (d.alts.a2) { base = cfg.tasas[d.apoyo].slice(); if (d.alts.a4) base = base.map(x => x + cfg.bonusCombo); }
  else if (d.alts.a4) base = cfg.tasas.control.slice();
  let r4 = null, r5 = null;
  if (base) {
    r4 = demora4 != null ? demora4 : base[0] - penal4;
    r5 = base[1];
    if (promotor5) r5 = cfg.tasas.promotor[1] + (d.alts.a4 ? cfg.bonusCombo : 0);
    if (migra) r5 = cfg.tasas.promotor[0] + cfg.bonusCombo;
    if (st.monitoreo) { r4 += cfg.bonusMonitoreo; r5 += cfg.bonusMonitoreo; }
    r4 = Math.min(r4, cfg.tasaMax); r5 = Math.min(r5, cfg.tasaMax);
  }

  /* ---- familias, hectáreas y toneladas ---- */
  const fam0 = st.fam;
  const f4 = Math.max(0, fam0 - (d.familias === 'expulsion' ? 3 : 0));
  let f5 = readmite ? fam0 : Math.max(0, f4 - salidas5);
  if (detener) f5 = 0;
  const h4 = Math.max(0, f4 * cfg.haFam + haAdj4);
  const h5 = detener ? 0 : Math.max(0, f5 * cfg.haFam + haAdj5);
  const cap4 = cfg.minimo + st.opcion, cap5 = digital5 ? cfg.minimo + st.opcion : cfg.minimo;
  const est = base != null; // hay estimación técnica
  const okNM = card ? acepta : est; // antes de la compuerta se proyecta como si NordMarkt aceptara
  const t4 = okNM && r4 != null ? Math.min(h4 * cfg.rend * r4, cap4) : 0;
  const t5 = okNM && r5 != null && !detener ? Math.min(h5 * cfg.rend * r5, cap5) : 0;
  if (card && !acepta) alertas.push('NordMarkt mantiene la revisión reforzada: sin declaración regenerativa y con la alianza en riesgo.');
  if (okNM && t4 > 0 && t4 < cfg.minimo) alertas.push(`Año 4 bajo el mínimo de ${cfg.minimo} t: NordMarkt puede terminar la alianza.`);
  if (okNM && !detener && t5 > 0 && t5 < cfg.minimo) alertas.push(`Año 5 bajo el mínimo de ${cfg.minimo} t: NordMarkt puede terminar la alianza.`);
  if (detener) notas.push('La mesa detuvo el piloto al final del año 4.');

  const usoFondoAndina = cont / 2, usoFondoAsoc = cont / 2;
  const contribucion = (t4 + t5) * st.margen - andina - usoFondoAndina;
  const primaTotal = (t4 + t5) * st.prima;
  const primaNeta = primaTotal - asoc - usoFondoAsoc;
  const famProm = f5 > 0 ? (f4 + f5) / 2 : f4;
  const enJuego = 2 * Math.min(fam0 * cfg.haFam * cfg.rend, cfg.minimo + st.opcion);

  /* ---- impacto ---- */
  const inclusion = (digital && (d.apoyo !== 'ninguno' || promotor5)) || (d.alts.a4 && !digital);
  const gobernanza = datos === 'asociacion' && !usaPrecios && familias === 'verificacion' && !ocultar;
  const ambiental = (d.sensores && afirmacion !== 'empaque') || (!!agua && agua !== 'nada');
  const pts = [inclusion, gobernanza, ambiental].filter(Boolean).length;

  return {
    sel, digital, digital5, vp, acepta, est, okNM,
    costos: { inst, y4, y5, total },
    fin: { nm, nmElegible, fondo, fondoElegible, asoc, cont, andina, sobre: andina > cfg.presupuesto },
    tasas: [r4, r5], caps: [cap4, cap5], fam: [f4, f5], ha: [h4, h5], t: [t4, t5],
    contribucion, primaTotal, primaNeta, primaFam: famProm ? primaNeta / famProm : 0, enJuego,
    impacto: { pts, inclusion, gobernanza, ambiental }, alertas, notas,
    final: { familias, datos, usaPrecios, migra, promotor5, readmite, ocultar, escala, afirmacion, detener, agua, addA4 }
  };
}

if (typeof module !== 'undefined') module.exports = { DEFAULT_CFG, ALTS, CARTAS, calcC, asignarCarta, puntoReferencia, puntoComun };

<script>
(function () {

const t1 = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Para no configurar cada computadora: pegue aquí la URL del Web App y la clave antes de distribuir el archivo */

/* ================== registro en Google Sheets ================== */

/* ================== cálculo ================== */
const altsTxt = d => ['a1', 'a2', 'a3', 'a4'].filter(k => d.alts[k]).map(k => ALTS[k].n).join(' + ') + (d.sensores ? ' + 5' : '');
const dProy = () => { const d = clone(ST.d); if (!d.datos) d.datos = 'asociacion'; if (!d.familias) d.familias = 'verificacion'; return d; };

/* ================== reloj ================== */

setInterval(() => { const el = document.getElementById('reloj'); if (el) { const t = textoReloj(ST.ronda); if (t) { el.textContent = t.txt; el.className = 'clock ' + t.cls; } } }, 1000);

const ROLES = { andina: 'Andina', asoc: 'Asociación', nm: 'NordMarkt', todos: 'Mesa' };

}
const allRatified = (r, roles) => roles.every(x => (ST.ratif[r] || {})[x]);
const R3 = ['andina', 'asoc', 'nm'];

/* ================== navegación ================== */
const STEPS = ['Inicio', '1 · Elegir', '2 · Reglas', '3 · Compuerta', '4 · Comité', 'Cierre'];

  $('steps').innerHTML = STEPS.map((s, i) => `<button type="button" class="step ${i === ST.ronda ? 'on' : i <= ST.max ? 'done' : ''}" data-go="${i}" ${i > ST.max ? 'disabled' : ''}>${s}</button>`).join('');

function go(i) { ST.ronda = i; ST.max = Math.max(ST.max, i); marcarInicio(i); save(); render(); window.scrollTo(0, 0); }
function render() {
  renderSteps(); refreshSyncPill();
  const r = ST.ronda;
  $('app').innerHTML = r === 0 ? vInicio() : r === 1 ? vR1() : r === 2 ? vR2() : r === 3 ? vR3() : r === 4 ? vR4() : vCierre();

}

/* ================== eventos ================== */
function invalidar(r) {
  if (r === 1) { ST.ratif.r1 = {}; ST.ratif.r2 = {}; }
  if (r === 2) ST.ratif.r2 = {};
  if (r === 3) { ST.ratif.r3 = {}; ST.calc.r3 = null; }
}
function cargarStart(s, msg) { ST.start = s; ST.startUI.msg = msg || ''; log('Punto de partida: ' + (s.referencia ? 'referencia' : s.origen)); save(); render(); }
const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) { go(+b.dataset.go); return; }
  if (b.dataset.seg) { setPath(b.dataset.seg, JSON.parse(b.dataset.val)); invalidar(ST.ronda); save(); render(); return; }
  if (b.dataset.ratif) { const [r, x] = b.dataset.ratif.split('.'); ST.ratif[r][x] = !ST.ratif[r][x]; save(); render(); return; }
  if (b.dataset.alt) {
    const k = b.dataset.alt;
    if (k === 'a5') ST.d.sensores = !ST.d.sensores; else { ST.d.alts[k] = !ST.d.alts[k]; if (ST.d.alts[k] && ST.d.descartada === k) ST.d.descartada = ''; }
    invalidar(1); save(); render(); return;
  }
  if (b.dataset.tab) return;
  switch (b.id) {
    case 'empezar': log('Inicio de la mesa'); enviar('inicio', { puntoPartida: ST.start }); go(1); break;
    case 'cerrarR1': log('Ronda 1: ' + altsTxt(ST.d)); enviar('r1_eleccion', { alternativas: altsTxt(ST.d), descartada: ST.d.descartada }); go(2); break;
    case 'firmarPlan': {
      const id = asignarCarta(ST.d);
      if (!ST.carta.forzada || !ST.carta.id) ST.carta = { id, ops: {}, detener: false, agua: null, aguaOn: false, vista: false, forzada: false };
      else ST.carta.vista = false;
      ST.calc.r3 = null; ST.ratif.r3 = {};
      log('Plan firmado; carta ' + ST.carta.id); enviar('r2_plan_firmado', { carta: ST.carta.id }); go(3); break;
    }
    case 'verCarta': ST.carta.vista = true; $('layer').innerHTML = ''; save(); render(); break;
    case 'pedirAgua': ST.carta.aguaOn = true; invalidar(3); log('Carta comodín'); save(); render(); break;
    case 'calcR3': {
      ST.intentos.r3 = (ST.intentos.r3 || 0) + 1;
      const r = calcC(CFG, ST.start, ST.d, cartaActual()); ST.calc.r3 = r;
      log(`R3: t ${t1(r.t[0])}/${t1(r.t[1])}; Andina ${Ssigned(r.contribucion)}; familias ${r.fam[1]}`);
      enviar('r3_resultado', { carta: ST.carta.id, ops: ST.carta.ops, detener: ST.carta.detener, agua: ST.carta.aguaOn ? ST.carta.agua : null });
      save(); render(); break;
    }
    case 'aR4': go(4); break;
    case 'registrarComite': log('Comité registrado'); enviar('r4_comite', ST.comite); go(5); break;
    case 'revelar': ST.revelado = true; log('Revelación de las tres familias'); enviar('revelacion_familias'); save(); render(); break;
    case 'enviarCierre': log('Cierre registrado'); enviar('cierre'); save(); b.textContent = 'Cierre registrado ✓'; break;
    case 'copiarEstado': copiar(JSON.stringify(estadoFinal(), null, 2)); break;
    case 'descargarEstado': descargar(); break;
    case 'openFac': abrirFacilitador(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest && t.closest('#layer')) return;
  if (t.id === 'mesa') { ST.mesa = t.value; save(); const b = $('empezar'); if (b) b.disabled = !(t.value.trim() && ST.start); return; }
  if (t.dataset.rep) { ST.reps[t.dataset.rep] = t.value; save(); return; }
  if (t.dataset.text) { setPath(t.dataset.text, t.value); save(); return; }
  if (t.dataset.num) { setPath(t.dataset.num, +t.value); save(); return; }
  if (t.dataset.path) { const v = +t.value; setPath(t.dataset.path, v); const lab = $('v_' + t.dataset.path); if (lab) lab.textContent = FMT[t.dataset.fmt](v); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest && t.closest('#layer')) return;
  if (t.dataset.path) { invalidar(ST.ronda); save(); render(); }
  if (t.dataset.chk) { setPath(t.dataset.chk, t.checked); invalidar(ST.ronda); save(); render(); }
  if (t.dataset.sel) { setPath(t.dataset.sel, t.value); invalidar(ST.ronda); save(); render(); }
});

async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); const c = $('copiado'); if (c) c.textContent = 'Copiado'; }
  catch (e) { mostrarTexto(txt); }
}
function descargar() {
  let enMarco = true; try { enMarco = window.self !== window.top; } catch (e) { }
  if (enMarco) { mostrarTexto(JSON.stringify(estadoFinal(), null, 2)); return; }
  try {
    const blob = new Blob([JSON.stringify(estadoFinal(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'andina-c-' + (ST.mesa || 'mesa').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { mostrarTexto(JSON.stringify(estadoFinal(), null, 2)); }
}
function mostrarTexto(txt) {
  $('layer').innerHTML = `<div class="overlay"><div class="modal"><h2>Copien este texto</h2><textarea style="min-height:320px" class="mono" readonly>${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn" type="button" id="cerrarLayer">Cerrar</button></div></div></div>`;
  $('cerrarLayer').onclick = () => { $('layer').innerHTML = ''; };
}

/* ================== panel del facilitador ================== */
let facTab = 'guia';
const PARAMS = [['presupuesto', 'Presupuesto de Andina (S/)'], ['asocMax', 'Aporte máximo de la asociación'], ['nmMax', 'Aporte máximo de NordMarkt'], ['fondoPct', 'Fondo concursable (fracción de la instalación)'],
  ['telefonos', 'Teléfonos (S/, una vez)'], ['promotor', 'Promotor (S/ por año)'], ['minimo', 'Mínimo de NordMarkt (t)'], ['rend', 'Rendimiento años 4 y 5 (t/ha)'],
  ['tasaDemora', 'Evidencia año 4 tras rediseño tardío'], ['bonusMonitoreo', 'Bonificación por monitoreo del Caso A'], ['tasaMax', 'Evidencia máxima'],
  ['minR0', 'Minutos inicio'], ['minR1', 'Minutos ronda 1'], ['minR2', 'Minutos ronda 2'], ['minR3', 'Minutos ronda 3'], ['minR4', 'Minutos ronda 4'], ['minCierre', 'Minutos cierre']];
function abrirFacilitador() {
  if (!store.get('andina.facOK', false)) {
    $('layer').innerHTML = `<div class="overlay"><div class="modal" style="max-width:420px"><h2>Panel del facilitador</h2><div class="field"><label>Clave</label><input type="password" id="pin"></div><div class="row"><button class="btn" type="button" id="pinOK">Entrar</button><button class="btn ghost" type="button" id="cerrarLayer">Cancelar</button></div><div class="small" id="pinErr"></div></div></div>`;
    $('cerrarLayer').onclick = () => { $('layer').innerHTML = ''; };
    $('pinOK').onclick = () => { if ($('pin').value === CFG.pin) { store.set('andina.facOK', true); abrirFacilitador(); } else $('pinErr').textContent = 'Clave incorrecta.'; };
    return;
  }
  const tab = { guia: facGuia, mesas: facMesas, parametros: facParametros, conexion: facConexion, mesa: facMesa }[facTab]();
  $('layer').innerHTML = `<div class="overlay"><div class="modal"><div class="row" style="justify-content:space-between"><h2>Panel del facilitador</h2><button class="btn ghost" type="button" id="cerrarFac">Cerrar</button></div>
   <div class="tabs">${[['guia', 'Guía'], ['mesas', 'Todas las mesas'], ['parametros', 'Parámetros'], ['conexion', 'Google Sheets'], ['mesa', 'Esta mesa']].map(([k, t]) => `<button type="button" data-tab="${k}" class="${facTab === k ? 'on' : ''}">${t}</button>`).join('')}</div>${tab}</div></div>`;
  $('cerrarFac').onclick = () => { $('layer').innerHTML = ''; render(); };
  $('layer').querySelectorAll('[data-tab]').forEach(x => x.onclick = () => { facTab = x.dataset.tab; abrirFacilitador(); });
  bindFac();
}
function facGuia() {
  let m = 0; const fila = (min, et, q) => { const s = `<tr><td>${m}–${m + min}</td><td>${et}</td><td>${q}</td></tr>`; m += min; return s; };
  return `<h3>Agenda de ${CFG.minR0 + CFG.minR1 + CFG.minR2 + CFG.minR3 + CFG.minR4 + CFG.minCierre} minutos</h3>
  <table class="tbl"><tr><th>Minuto</th><th>Etapa</th><th>Qué hace el facilitador</th></tr>
  ${fila(CFG.minR0, 'Inicio', 'Todas las mesas parten de condiciones comunes propias del Caso C, sin importar los resultados de otras simulaciones.')}
  ${fila(CFG.minR1, 'Ronda 1 · Elegir', 'Si una mesa elige blockchain o huella de origen sola, pregunte: «¿cómo sabrán de qué parcela vino cada saco?». No dé la respuesta.')}
  ${fila(CFG.minR2, 'Ronda 2 · Reglas', 'Empuje la discusión sobre los datos y las tres familias. Al firmar, la pantalla asigna la carta.')}
  ${fila(CFG.minR3, 'Ronda 3 · Compuerta', 'La carta aparece en pantalla. Las mesas que terminen antes pueden pedir la carta comodín del agua.')}
  ${fila(CFG.minR4, 'Ronda 4 · Comité', 'Elija dos mesas con decisiones contrastantes. Cada una presenta en 2 minutos con la pantalla «Su piloto en una pantalla». El plenario vota.')}
  ${fila(CFG.minCierre, 'Cierre', 'Pida a todas las mesas pulsar «Revelar» a la vez; aparece también cómo habría cambiado su plan con menor participación de productores. Tres mensajes: inalterable no es verdadero; sin tecnología gana el año y con tecnología la escala; lo caro son los complementos.')}</table>
  <h3 style="margin-top:14px">Reglas de asignación de cartas (la primera que aplique)</h3>
  <table class="tbl">${['c1', 'c2', 'c3', 'c7', 'c4', 'c6', 'c5', 'agua'].map((k, i) => `<tr><td>${k === 'agua' ? '—' : i + 1}</td><td><b>${esc(CARTAS[k].titulo)}</b></td><td>${esc(CARTAS[k].regla)}</td></tr>`).join('')}</table>`;
}
function facMesas() {
  return `<p class="sub">Lee de la hoja el último estado de cada mesa en el Caso C. También pueden pegar estados copiados.</p>
  <div class="row"><button class="btn" type="button" id="cargarMesas" ${CONN.sheetUrl ? '' : 'disabled'}>Cargar desde Google Sheets</button><span class="small" id="mesasMsg"></span></div>
  <div class="field"><label>O peguen estados (uno por línea o una lista)</label><textarea id="pegarEstados" class="mono"></textarea><button class="btn ghost" type="button" id="verPegados">Mostrar</button></div>
  <div id="tablaMesas"></div>`;
}
function tablaMesas(list) {
  if (!list.length) return '<div class="empty"><b>Sin mesas</b>Todavía no hay estados registrados.</div>';
  return `<div class="scroll"><table class="tbl"><tr><th>Mesa</th><th>Partida</th><th>Alternativas</th><th>Datos · familias</th><th>Carta</th><th>t año 4 · 5</th><th>Andina</th><th>Familias año 5</th><th>Impacto</th><th>Comité</th></tr>
  ${list.map(e => { const p = e.plan || {}, r = e.resultado, s = e.puntoPartida || {};
    const alts = p.alts ? ['a1', 'a2', 'a3', 'a4'].filter(k => p.alts[k]).map(k => ALTS[k].n).join('+') + (p.sensores ? '+5' : '') : '—';
    return `<tr><td><b>${esc(e.mesa)}</b></td><td>${s.fam != null ? s.fam + ' fam' + (s.referencia ? ' (ref.)' : '') : '—'}</td><td>${esc(alts)}${p.alts && p.alts.a2 ? ' · ' + esc(p.apoyo) : ''}</td>
    <td>${esc(p.datos || '—')} · ${esc(p.familias || '—')}</td><td>${e.carta && e.carta.id ? esc(CARTAS[e.carta.id].titulo) : '—'}</td>
    <td class="n">${r ? t1(r.toneladas[0]) + ' · ' + t1(r.toneladas[1]) : '—'}</td><td class="n">${r ? Ssigned(r.contribucionAndina) : '—'}</td><td class="n">${r ? r.familias[1] : '—'}</td>
    <td class="n">${r ? r.impacto.pts + '/3' : '—'}</td><td>${e.comite && e.comite.veredicto ? esc(e.comite.veredicto) : '—'}</td></tr>`; }).join('')}</table></div>`;
}
function facParametros() {
  return `<p class="sub">Cambios guardados en esta computadora. El Caso C siempre comienza de forma independiente, con los mismos parámetros para todas las mesas.</p>
  <div class="params">${PARAMS.map(([k, l]) => `<label>${l}<input type="number" step="any" data-cfg="${k}" value="${CFG[k]}"></label>`).join('')}</div>
  <h3 style="margin-top:14px">Costos de las alternativas</h3><div class="params">${Object.keys(CFG.alts).map(k => `<label>${ALTS[k].n}. ${esc(ALTS[k].corto)} · instalación<input type="number" data-alt-cfg="${k}.inst" value="${CFG.alts[k].inst}"></label><label>${ALTS[k].n}. ${esc(ALTS[k].corto)} · anual<input type="number" data-alt-cfg="${k}.anual" value="${CFG.alts[k].anual}"></label>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn" type="button" id="guardarCfg">Guardar parámetros</button><button class="btn ghost" type="button" id="copiarCfg">Copiar configuración</button><button class="btn ghost" type="button" id="restaurarCfg">Restaurar valores del caso</button></div>
  <div class="field"><label>Pegar configuración</label><textarea id="pegarCfg" class="mono"></textarea><button class="btn ghost" type="button" id="aplicarCfg">Aplicar</button></div>`;
}
function facConexion() {
  return `<p class="sub">Conecta exclusivamente las respuestas del Caso C con su propia hoja de Google Sheets. No se consultan ni importan datos de A/B.</p>
  <div class="field"><label>URL del Web App de Google Apps Script</label><input type="text" id="sheetUrl" value="${esc(CONN.sheetUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="field"><label>Clave compartida (la misma que en el script)</label><input type="text" id="clave" value="${esc(CONN.clave)}"></div>
  <div class="row"><button class="btn" type="button" id="guardarConn">Guardar y probar</button><span class="small">Eventos en cola: ${queue.length}</span></div>
  <div class="note warn">Por seguridad, la vista previa publicada en Claude no puede enviar ni leer datos de Google. El registro funciona con el archivo HTML abierto en el navegador o alojado en un sitio web.</div>`;
}
function facMesa() {
  const opts = Object.keys(CARTAS).filter(k => k !== 'agua');
  return `<div class="row"><button class="btn ghost" type="button" id="irRonda">Desbloquear todas las rondas</button><button class="btn ghost" type="button" id="refMesa">Usar el punto de partida común en esta mesa</button><button class="btn ghost" type="button" id="reiniciar">Reiniciar esta mesa</button></div>
  <div class="field" style="margin-top:12px"><label>Cambiar la carta de esta mesa (actual: ${ST.carta.id ? esc(CARTAS[ST.carta.id].titulo) : '—'}; según reglas: ${ST.d.datos && ST.d.familias ? esc(CARTAS[asignarCarta(ST.d)].titulo) : '—'})</label>
  <div class="row"><select id="cartaForzada">${opts.map(k => `<option value="${k}" ${ST.carta.id === k ? 'selected' : ''}>${esc(CARTAS[k].titulo)}</option>`).join('')}</select><button class="btn ghost" type="button" id="aplicarCarta">Aplicar carta</button></div></div>
  <div class="small" style="margin-top:10px">Mesa: <b>${esc(ST.mesa || '—')}</b> · ronda ${ST.ronda}</div>
  <h3 style="margin-top:12px">Estado actual</h3><textarea class="mono" style="min-height:220px" readonly>${esc(JSON.stringify(estadoFinal(), null, 2))}</textarea>`;
}
function bindFac() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on('guardarCfg', () => {
    CFG.modoPartida = 'comun';
    document.querySelectorAll('[data-cfg]').forEach(i => { CFG[i.dataset.cfg] = +i.value; });
    document.querySelectorAll('[data-alt-cfg]').forEach(i => { const [k, f] = i.dataset.altCfg.split('.'); CFG.alts[k][f] = +i.value; });
    store.set('andinaC.cfg', CFG); abrirFacilitador();
  });
  on('copiarCfg', () => copiar(JSON.stringify(CFG)));
  on('restaurarCfg', () => { CFG = clone(DEFAULT_CFG); store.del('andinaC.cfg'); abrirFacilitador(); });
  on('aplicarCfg', () => { try { CFG = deepMerge(DEFAULT_CFG, JSON.parse($('pegarCfg').value)); CFG.modoPartida = 'comun'; store.set('andinaC.cfg', CFG); abrirFacilitador(); } catch (e) { $('pegarCfg').value = 'Texto no válido'; } });
  on('guardarConn', () => { CONN.sheetUrl = $('sheetUrl').value.trim(); CONN.clave = $('clave').value.trim(); store.set('andinaC.conn', CONN); enviar('prueba_conexion'); abrirFacilitador(); });
  on('cargarMesas', async () => {
    $('mesasMsg').textContent = 'Cargando…';
    try { const r = await fetch(CONN.sheetUrl + (CONN.sheetUrl.includes('?') ? '&' : '?') + 'clave=' + encodeURIComponent(CONN.clave) + '&sesion=C'); const data = await r.json();
      $('tablaMesas').innerHTML = tablaMesas(Array.isArray(data) ? data : []); $('mesasMsg').textContent = (Array.isArray(data) ? data.length : 0) + ' mesas'; }
    catch (e) { $('mesasMsg').textContent = 'No se pudo leer la hoja. Revisen la URL y que el Web App sea accesible para cualquiera.'; }
  });
  on('verPegados', () => {
    const raw = $('pegarEstados').value.trim(); let list = [];
    try { const v = JSON.parse(raw); list = Array.isArray(v) ? v : [v]; } catch (e) { list = raw.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (x) { return null; } }).filter(Boolean); }
    $('tablaMesas').innerHTML = tablaMesas(list.map(x => x.estado || x));
  });
  on('irRonda', () => { ST.max = 5; save(); abrirFacilitador(); });
  on('refMesa', () => { ST.start = puntoComun(CFG); log('Facilitador: punto de partida común'); save(); abrirFacilitador(); });
  on('aplicarCarta', () => { const k = $('cartaForzada').value; ST.carta = { id: k, ops: {}, detener: false, agua: null, aguaOn: false, vista: true, forzada: true }; ST.calc.r3 = null; ST.ratif.r3 = {}; log('Facilitador cambió la carta: ' + k); save(); abrirFacilitador(); });
  on('reiniciar', function () { if (this.dataset.c !== '1') { this.dataset.c = '1'; this.textContent = 'Confirmar reinicio'; return; } ST = estadoNuevo(); save(); $('layer').innerHTML = ''; render(); });
}

render(); flush();
})();

</script>
